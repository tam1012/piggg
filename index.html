<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trại Heo — Farm 3D cho vui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.48) 0%, rgba(255, 240, 246, 0.28) 100%);
    --glass-border: rgba(255, 255, 255, 0.68);
    --glass-glow: 0 10px 30px rgba(242, 136, 159, 0.2), 0 4px 14px rgba(20, 28, 45, 0.08);
    --glass-inner: inset 0 1.5px 1px rgba(255, 255, 255, 0.95), inset 0 -1px 1px rgba(242, 136, 159, 0.15);
    --text-main: #33202b;
    --text-dim: #6d5b67;
    --accent: #ff5e88;
    --accent-glow: rgba(255, 94, 136, 0.4);
    --btn-glass: linear-gradient(135deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.2));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1026; }
  body {
    font-family: 'Nunito', system-ui, -apple-system, sans-serif;
    color: var(--text-main);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; outline: none; touch-action: none; }

  /* ---------- loading ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 60;
    background: radial-gradient(circle at center, #ffd6e2 0%, #ffbad0 50%, #f79cb7 100%);
    display: flex; flex-direction: column; gap: 16px;
    align-items: center; justify-content: center;
    transition: opacity .6s cubic-bezier(0.2, 0.9, 0.3, 1), transform .6s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  #loading.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
  #loading .pig {
    font-size: 68px;
    filter: drop-shadow(0 12px 20px rgba(214, 60, 100, 0.35));
    animation: jellyBob 1.2s ease-in-out infinite;
  }
  #loading .msg {
    font-size: 16px; font-weight: 800; color: #5c2738;
    background: rgba(255, 255, 255, 0.75);
    padding: 8px 20px; border-radius: 999px;
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 8px 20px rgba(214, 60, 100, 0.15);
    backdrop-filter: blur(10px);
    letter-spacing: .02em;
  }
  @keyframes jellyBob {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    30% { transform: translateY(-16px) scale(0.96, 1.05); }
    50% { transform: translateY(0) scale(1.05, 0.95); }
    70% { transform: translateY(-4px) scale(0.98, 1.02); }
  }

  /* ---------- shared frosted glass pill ---------- */
  .pill {
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    border-radius: 20px;
    box-shadow: var(--glass-glow), var(--glass-inner);
    backdrop-filter: blur(24px) saturate(200%);
    -webkit-backdrop-filter: blur(24px) saturate(200%);
    position: relative;
    overflow: hidden;
  }
  .pill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 42%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.05) 100%);
    pointer-events: none;
    border-radius: inherit;
  }

  /* ---------- title ---------- */
  #title {
    position: fixed; top: 16px; left: 16px; z-index: 20;
    padding: 12px 18px 13px;
    line-height: 1.2;
    transition: all .4s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  #title:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 36px rgba(242, 136, 159, 0.3), var(--glass-inner);
  }
  #title h1 {
    font-size: 21px; font-weight: 900; letter-spacing: .04em;
    color: #2b1823; display: flex; align-items: center; gap: 4px;
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
  }
  #title h1 .oink {
    color: var(--accent);
    background: linear-gradient(135deg, #ff4d79, #ff82a3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #title .sub {
    font-size: 12px; font-weight: 700; color: var(--text-dim); margin-top: 3px;
  }
  #stats {
    font-size: 12px; font-weight: 700; color: var(--text-dim); margin-top: 6px;
    background: rgba(255, 255, 255, 0.45);
    padding: 3px 8px; border-radius: 999px; display: inline-block;
    border: 1px solid rgba(255, 255, 255, 0.6);
  }
  #stats b { color: var(--accent); font-weight: 800; }

  /* ---------- settings ---------- */
  #settings {
    position: fixed; top: 16px; right: 16px; z-index: 20;
    display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end;
    max-width: 65vw;
    transition: opacity .4s ease, transform .4s ease;
  }
  .set {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: 999px;
  }
  .set label {
    font-size: 11px; font-weight: 800; letter-spacing: .05em;
    color: var(--text-dim); text-transform: uppercase;
  }
  .set select {
    appearance: none; -webkit-appearance: none;
    background: var(--btn-glass); color: var(--text-main);
    border: 1.2px solid rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.9);
    font: 800 12.5px/1 'Nunito', system-ui, sans-serif;
    padding: 6px 24px 6px 11px;
    cursor: pointer;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23ff5e88' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 9px center;
    transition: all .2s ease;
  }
  .set select:hover {
    background-color: rgba(255, 255, 255, 0.8);
    transform: scale(1.02);
  }
  .set select option { background: #fff5f8; color: #33202b; font-weight: 700; }
  .set button {
    background: var(--btn-glass); color: var(--text-main);
    border: 1.2px solid rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.9);
    font: 800 12.5px/1 'Nunito', system-ui, sans-serif;
    padding: 6px 14px; cursor: pointer; min-width: 48px;
    transition: all .2s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .set button:hover {
    background: rgba(255, 255, 255, 0.85);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px var(--accent-glow);
  }
  .set button:active { transform: scale(0.95); }
  .set button.on {
    color: #fff; background: linear-gradient(135deg, #ff5e88, #ff82a3);
    border-color: rgba(255, 255, 255, 0.9);
    box-shadow: 0 4px 14px var(--accent-glow), inset 0 1px 1px rgba(255, 255, 255, 0.6);
  }
  body.cinematic #settings, body.cinematic #title, body.cinematic #hints, body.cinematic #quest {
    opacity: 0; pointer-events: none; transform: translateY(-8px);
  }

  /* ---------- hints ---------- */
  #hints {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    z-index: 20; padding: 9px 18px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center;
    max-width: 95vw;
    border-radius: 999px;
    transition: opacity .4s ease;
  }
  #hints .h { font-size: 12.5px; font-weight: 800; color: var(--text-main); white-space: nowrap; }
  #hints kbd {
    font: 800 11px/1 'Nunito', ui-monospace, sans-serif;
    background: linear-gradient(180deg, #ffffff, #ffeaf0);
    border: 1.2px solid rgba(255, 140, 170, 0.4);
    box-shadow: 0 2px 4px rgba(255, 94, 136, 0.15), inset 0 1px 0 #fff;
    border-radius: 8px; padding: 3px 7px; color: var(--accent);
    margin-right: 4px; display: inline-block;
  }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%) translateY(10px) scale(0.95);
    z-index: 30; padding: 10px 22px;
    font-size: 14.5px; font-weight: 800; color: #2c1a25;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 240, 246, 0.78));
    border: 1.8px solid #ffffff;
    box-shadow: 0 14px 38px rgba(242, 94, 136, 0.28), inset 0 1.5px 1px #fff;
    opacity: 0; transition: all .35s cubic-bezier(0.2, 0.9, 0.3, 1);
    pointer-events: none; max-width: 88vw; text-align: center;
    border-radius: 999px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

  /* ---------- debug ---------- */
  #debug {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 25; padding: 6px 14px;
    font: 700 12px/1.4 'Nunito', ui-monospace, monospace; color: #0c693a;
    background: rgba(220, 255, 235, 0.75);
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    border-radius: 999px;
    display: none; white-space: pre;
    box-shadow: 0 8px 24px rgba(16, 140, 70, 0.15);
  }

  /* ---------- touch controls ---------- */
  #touch { display: none; }
  body.touch #touch { display: block; }
  body.touch #hints .kb { display: none; }
  #joy {
    position: fixed; left: 24px; bottom: 28px; z-index: 25;
    width: 124px; height: 124px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, rgba(255, 230, 240, 0.18) 100%);
    border: 2px solid rgba(255, 255, 255, 0.65);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15), inset 0 2px 4px rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(14px);
    touch-action: none;
  }
  #joy .knob {
    position: absolute; left: 50%; top: 50%; width: 50px; height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffffff 0%, #ffdbe6 100%);
    border: 1.5px solid #ffffff;
    box-shadow: 0 6px 16px rgba(255, 94, 136, 0.3), inset 0 2px 2px #fff;
    transform: translate(-50%,-50%);
  }
  #tbtns {
    position: fixed; right: 18px; bottom: 22px; z-index: 25;
    display: grid; grid-template-columns: repeat(2, 66px); gap: 11px;
  }
  #tbtns button {
    height: 58px; border-radius: 50%;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 235, 242, 0.4) 100%);
    border: 1.8px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 8px 20px rgba(242, 136, 159, 0.22), inset 0 1.5px 1px rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(16px);
    color: #3b2230; font: 900 13px/1.1 'Nunito', system-ui, sans-serif;
    touch-action: none; transition: transform .15s ease, background .15s ease;
  }
  #tbtns button:active {
    transform: scale(0.92);
    background: linear-gradient(135deg, #ff5e88, #ff82a3);
    color: #fff;
  }
  #tbtns button.on {
    background: linear-gradient(135deg, #ff5e88, #ff82a3);
    color: #fff;
    border-color: #fff;
  }

  /* ---------- quest chip ---------- */
  #quest {
    position: fixed; top: 102px; left: 16px; z-index: 20;
    padding: 8px 16px; font-size: 13.5px; font-weight: 800; color: #2e1a26;
    border-radius: 999px;
  }

  /* ---------- chụp ảnh ---------- */
  #flash {
    position: fixed; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; z-index: 55;
  }
  #flash.go { animation: flashAnim .35s ease; }
  @keyframes flashAnim { 0% { opacity: .95 } 100% { opacity: 0 } }
  #photoFrame { display: none; pointer-events: none; position: fixed; inset: 0; z-index: 40; }
  #photoFrame::before {
    content: ''; position: absolute; inset: 12px;
    border: 5px solid #ff7b9e;
    border-radius: 24px;
    box-shadow: inset 0 0 0 5px rgba(255, 255, 255, 0.75), 0 0 30px rgba(255, 123, 158, 0.35);
  }
  #photoFrame .cap {
    position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%);
    padding: 10px 22px; font-weight: 800; font-size: 14px;
    background: rgba(255, 255, 255, 0.85); color: #401f2e;
    border-radius: 999px; border: 2px solid #fff;
  }
  body.photo #photoFrame { display: block; }
  body.photo #settings, body.photo #title, body.photo #hints, body.photo #quest { opacity: 0; pointer-events: none; }

  /* ---------- đổi màu heo ---------- */
  #colorModal {
    display: none; position: fixed; inset: 0; z-index: 45;
    background: rgba(40, 20, 32, 0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    align-items: center; justify-content: center;
  }
  #colorModal.show { display: flex; animation: modalPop .25s cubic-bezier(0.2, 0.9, 0.3, 1); }
  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.93); }
    to { opacity: 1; transform: scale(1); }
  }
  #colorModal .card {
    padding: 22px; width: min(92vw, 360px);
    display: flex; flex-direction: column; gap: 14px;
    border-radius: 26px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.85), rgba(255, 240, 246, 0.7));
  }
  #colorModal h3 {
    font-size: 17px; font-weight: 900; color: #2e1a26;
    display: flex; align-items: center; gap: 6px;
  }
  #colorModal input {
    background: rgba(255, 255, 255, 0.85);
    border: 1.5px solid rgba(255, 140, 170, 0.4);
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04);
    border-radius: 12px; color: var(--text-main);
    font: 800 14px 'Nunito', system-ui, sans-serif;
    padding: 10px 14px; outline: none; transition: border-color .2s;
  }
  #colorModal input:focus { border-color: var(--accent); }
  #swatches { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
  #swatches .sw {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2.5px solid #ffffff; cursor: pointer;
    font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    transition: transform .2s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  #swatches .sw:hover { transform: scale(1.15); }
  #swatches .sw.sel {
    border-color: #fff;
    box-shadow: 0 0 0 3px var(--accent), 0 6px 14px rgba(255, 94, 136, 0.4);
    transform: scale(1.1);
  }
  #colorModal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  #colorModal .row button {
    border: 1.5px solid rgba(255, 255, 255, 0.85); border-radius: 12px;
    background: rgba(255, 255, 255, 0.65); color: var(--text-main);
    font: 800 13px 'Nunito', system-ui, sans-serif; padding: 9px 16px; cursor: pointer;
    transition: all .2s ease;
  }
  #colorModal .row button:hover { background: #fff; transform: translateY(-1px); }
  #swSave {
    background: linear-gradient(135deg, #ff5e88, #ff82a3) !important;
    color: #fff !important; border-color: #fff !important;
    box-shadow: 0 4px 14px var(--accent-glow) !important;
  }

  /* ---------- mobile: mini row + piano ---------- */
  #miniRow {
    display: none; position: fixed; right: 18px; bottom: 226px; z-index: 25;
    gap: 9px;
  }
  #miniRow button {
    width: 54px; height: 46px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.65), rgba(255, 235, 242, 0.4));
    border: 1.5px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 6px 16px rgba(242, 136, 159, 0.2);
    backdrop-filter: blur(14px);
    color: var(--text-main); font: 900 12px 'Nunito', system-ui, sans-serif;
  }
  #piano {
    display: none; position: fixed; right: 18px; bottom: 280px; z-index: 25; gap: 6px;
  }
  #piano button {
    width: 38px; height: 66px; border-radius: 10px;
    background: linear-gradient(180deg, #ffffff 0%, #fff0f4 100%);
    border: 1.5px solid rgba(255, 140, 170, 0.4);
    box-shadow: 0 4px 12px rgba(242, 136, 159, 0.25);
    color: var(--accent); font: 900 16px 'Nunito', system-ui, sans-serif;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px;
    transition: all .15s ease;
  }
  #piano button:active { background: var(--accent); color: #fff; transform: translateY(2px); }
  body.piano #piano { display: flex; }
  body.touch #miniRow { display: flex; }

  @media (max-width: 760px) {
    #title { padding: 8px 12px; border-radius: 14px; top: 12px; left: 12px; }
    #title h1 { font-size: 15px; }
    #title .sub { display: none; }
    #stats { font-size: 10.5px; margin-top: 2px; }
    #settings { top: 12px; right: 12px; gap: 6px; max-width: 76vw; }
    .set { padding: 4px 8px; border-radius: 999px; }
    .set label { display: none; }
    .set select { font-size: 11.5px; padding: 4px 20px 4px 8px; }
    .set button { font-size: 11.5px; padding: 5px 10px; min-width: 40px; }
    #hints { bottom: 10px; padding: 7px 12px; gap: 8px; }
    #hints .h { font-size: 11px; }
    #quest { top: 72px; left: 12px; font-size: 11.5px; padding: 6px 12px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="loading">
  <div class="pig">🐷</div>
  <div class="msg">Đang dọn chuồng cho heo…</div>
</div>

<div id="title" class="pill">
  <h1>TRẠI <span class="oink">HEO</span></h1>
  <div class="sub">trang trại 3D — cho vui thôi 🐷</div>
  <div id="stats"><b id="oinkCount">0</b> tiếng ụt ịt · <b id="pigCount">0</b> heo</div>
</div>

<div id="settings">
  <div class="set pill"><label>Chất lượng</label>
    <select id="selQuality">
      <option value="low">Thấp</option>
      <option value="medium" selected>Vừa</option>
      <option value="high">Cao</option>
      <option value="ultra">Siêu</option>
    </select>
  </div>
  <div class="set pill"><label>Thời tiết</label>
    <select id="selWeather">
      <option value="clear" selected>Nắng</option>
      <option value="cloudy">Nhiều mây</option>
      <option value="rain">Mưa</option>
    </select>
  </div>
  <div class="set pill"><label>Giờ</label>
    <select id="selTime">
      <option value="cycle" selected>Chu kỳ ngày đêm</option>
      <option value="morning">Sáng</option>
      <option value="noon">Trưa</option>
      <option value="golden">Chiều vàng</option>
      <option value="sunset">Hoàng hôn</option>
      <option value="night">Đêm</option>
    </select>
  </div>
  <div class="set pill"><label>Âm thanh</label>
    <button id="btnSound">Tắt</button>
  </div>
</div>

<div id="hints" class="pill">
  <span class="h kb"><kbd>WASD</kbd>đi</span>
  <span class="h kb"><kbd>Shift</kbd>chạy</span>
  <span class="h kb"><kbd>Space</kbd>nhảy</span>
  <span class="h kb"><kbd>E</kbd>ụt ịt</span>
  <span class="h kb"><kbd>B</kbd>heo con</span>
  <span class="h kb"><kbd>F</kbd>ăn</span>
  <span class="h kb"><kbd>G</kbd>xịt 💨</span>
  <span class="h kb"><kbd>1-7</kbd>đàn heo</span>
  <span class="h kb"><kbd>P</kbd>tiệc 🎉</span>
  <span class="h kb"><kbd>H</kbd>ảnh</span>
  <span class="h kb"><kbd>T</kbd>trốn tìm</span>
  <span class="h kb"><kbd>Chuột</kbd>camera</span>
  <span class="h kb"><kbd>Lăn</kbd>zoom</span>
  <span class="h kb"><kbd>C</kbd>điện ảnh</span>
  <span class="h kb"><kbd>F3</kbd>debug</span>
</div>

<div id="toast" class="pill"></div>
<div id="debug" class="pill"></div>
<div id="quest" class="pill"></div>

<div id="flash"></div>
<div id="photoFrame"><div class="cap pill">🐷 TRẠI HEO · heomi.tam1012.site</div></div>

<div id="colorModal">
  <div class="card pill">
    <h3>🐷 Heo của bạn</h3>
    <input id="nameInput" maxlength="12" placeholder="Tên (tối đa 12 ký tự)">
    <div id="swatches"></div>
    <div class="row">
      <button id="swClose">Thoát</button>
      <button id="swSave">Xong</button>
    </div>
  </div>
</div>

<div id="touch">
  <div id="joy"><div class="knob"></div></div>
  <div id="tbtns">
    <button id="tRun">CHẠY</button>
    <button id="tJump">NHẢY</button>
    <button id="tEat">ĂN</button>
    <button id="tFart">XỊT</button>
    <button id="tOink">ỤT ỊT</button>
    <button id="tParty">TIỆC</button>
  </div>
  <div id="miniRow">
    <button id="tPhoto">ẢNH</button>
    <button id="tSeek">TÌM</button>
    <button id="tPiano">♪</button>
  </div>
  <div id="piano"></div>
</div>

<script>
  // bắt lỗi sớm: hiện lên màn hình chờ thay vì treo vô định
  window.__errs = [];
  function __showErr(m) {
    window.__errs.push(m);
    var el = document.querySelector('#loading .msg');
    if (el) el.textContent = 'Lỗi: ' + m;
  }
  addEventListener('error', e => __showErr(e.message || 'lỗi tài nguyên: ' + (e.target && e.target.src ? e.target.src.split('/').pop() : 'không rõ')), true);
  addEventListener('unhandledrejection', e => __showErr('rejection: ' + e.reason));
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
